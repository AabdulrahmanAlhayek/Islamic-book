<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مذكرة في الاحتجاج لأصول الإسلام</title>
<style>
* { box-sizing: border-box; }
body { font-family: Tahoma, Arial, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; overflow: hidden; }
#top-bar { background: #1f1f1f; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; flex-wrap: wrap; gap: 5px; }
.top-tools { display: flex; gap: 5px; align-items: center; }
.tool-btn { background: #2d2d2d; color: #4db8ff; border: 1px solid #4db8ff; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 12px; cursor: pointer; }
.tool-btn.active { background: #4db8ff; color: #000; }
#search-input { padding: 4px 8px; border-radius: 4px; border: 1px solid #555; background: #111; color: #fff; font-size: 12px; width: 130px; }

#tree-wrapper { height: 42%; overflow: auto; background: #161616; border-bottom: 2px solid #4db8ff; padding: 12px; transition: height 0.3s ease, padding 0.3s ease; }
#tree-wrapper.collapsed { height: 0; padding: 0; border: none; overflow: hidden; }
.tree { display: inline-flex; align-items: center; }
.tree ul { padding-right: 20px; position: relative; display: flex; flex-direction: column; justify-content: center; margin: 0; list-style: none; }
.tree li { display: flex; flex-direction: column; position: relative; padding: 4px 0; }
.tree li ul { margin-top: 4px; }
.tree li::before, .tree li::after { content: ''; position: absolute; right: -20px; border-color: #555; border-style: solid; }
.tree li::before { top: 0; height: 50%; width: 20px; border-width: 0 2px 2px 0; }
.tree li::after { top: 50%; height: 50%; width: 20px; border-width: 0 2px 0 0; }
.tree li:first-child::before, .tree li:last-child::after, .tree li:only-child::before { border-right: none; }
.tree li:only-child::after, .tree > ul::before, .tree > ul > li::before, .tree > ul > li::after { display: none; }
.tree ul::before { content: ''; position: absolute; right: 0; top: 50%; width: 20px; border-top: 2px solid #555; }

.node-row { display: flex; align-items: center; gap: 4px; }
.toggle-btn { background: #222; color: #4db8ff; border: 1px solid #555; border-radius: 3px; width: 16px; height: 16px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }

.node { background: #252525; border: 1px solid #444; color: #eee; padding: 6px 10px; border-radius: 7px; font-size: 12px; white-space: nowrap; font-family: inherit; cursor: pointer; }
.node:hover { background: #2f2f2f; }
.node.selected { background: #4db8ff; color: #000; font-weight: bold; border-color: #fff; }
.root-node { background: #0d3b66; border-color: #4db8ff; font-weight: bold; }
.main-branch { background: #1e2d3d; border-color: #3a7ca5; color: #80c8ff; font-weight: bold; }
.tag { background: rgba(0,0,0,0.4); padding: 1px 4px; border-radius: 4px; font-size: 10px; margin-right: 4px; color: #ffd166; }
.node.selected .tag { color: #000; background: rgba(255,255,255,0.4); }

#controls { background: #222; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; font-size: 12px; }
#controls button { background: #4db8ff; color: #000; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
#jump-input { width: 45px; padding: 4px; border-radius: 4px; border: 1px solid #555; background: #111; color: #fff; text-align: center; }

#img-container { flex: 1; width: 100%; overflow: auto; background: #2b2b2b; text-align: center; padding: 8px 0; display: flex; justify-content: center; align-items: flex-start; }
#page-img { max-width: 96%; height: auto; border-radius: 4px; transform-origin: top center; transition: filter 0.3s, transform 0.1s ease; }
#page-img.night { filter: invert(0.9) hue-rotate(180deg); }

/* نافذة دفتر الملاحظات */
#notes-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
#notes-content { background: #1f1f1f; width: 90%; max-width: 500px; height: 400px; border-radius: 8px; border: 1px solid #444; display: flex; flex-direction: column; padding: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
#notes-textarea { flex: 1; background: #121212; color: #fff; border: 1px solid #333; border-radius: 5px; padding: 10px; font-family: inherit; font-size: 13px; resize: none; margin-top: 10px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 14px; border-bottom: 1px solid #333; padding-bottom: 8px; }
.close-btn { background: #ff4d4d; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
</style>
</head>
<body>

<div id="top-bar">
    <div class="top-tools">
        <button type="button" class="tool-btn" id="btn-tree" onclick="toggleTree()">🔼 إخفاء الشجرة</button>
        <button type="button" class="tool-btn" id="btn-notes" onclick="toggleNotes(true)">📝 الملاحظات</button>
        <input type="text" id="search-input" placeholder="🔍 بحث في الشجرة..." oninput="searchTree(this.value)">
    </div>
    <div class="top-tools">
        <button type="button" class="tool-btn" onclick="zoomImg(0.15)">➕</button>
        <button type="button" class="tool-btn" onclick="zoomImg(-0.15)">➖</button>
        <button type="button" class="tool-btn" onclick="resetZoom()">🔄</button>
        <button type="button" class="tool-btn" id="btn-night" onclick="toggleNight()">🌙 وضع ليلي</button>
    </div>
</div>

<div id="tree-wrapper">
<div class="tree"><ul><li>
    <div class="node-row">
        <button type="button" class="toggle-btn" onclick="toggleSub(this)">-</button>
        <button type="button" class="node root-node" onclick="goImg(1, this)">مذكرة في الاحتجاج لأصول الإسلام</button>
    </div>
    <ul>
        <li><div class="node-row"><button type="button" class="node main-branch" onclick="goPage(2, this)">مقدمة <span class="tag">2</span></button></div></li>
        <li>
            <div class="node-row">
                <button type="button" class="toggle-btn" onclick="toggleSub(this)">-</button>
                <button type="button" class="node main-branch" onclick="goPage(6, this)">المبحث 1: مصادر المعرفة <span class="tag">6</span></button>
            </div>
            <ul>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(7, this)">أولاً: الفطرة <span class="tag">7</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(9, this)">ثانياً: الخبر والنقل <span class="tag">9</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(11, this)">ثالثاً: العقل <span class="tag">11</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(19, this)">رابعاً: الحس والتجريب <span class="tag">19</span></button></div></li>
            </ul>
        </li>
        <li>
            <div class="node-row">
                <button type="button" class="toggle-btn" onclick="toggleSub(this)">-</button>
                <button type="button" class="node main-branch" onclick="goPage(26, this)">المبحث 2: أدلة وجود الله <span class="tag">26</span></button>
            </div>
            <ul>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(27, this)">1. الهداية والغرائز <span class="tag">27</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(30, this)">2. الخلق والإيجاد <span class="tag">30</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(34, this)">3. الإتقان والإحكام <span class="tag">34</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(39, this)">4. المبادئ والقيم <span class="tag">39</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(45, this)">5. دلائل النبوة <span class="tag">45</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(46, this)">تنبيهات هامة <span class="tag">46</span></button></div></li>
            </ul>
        </li>
        <li>
            <div class="node-row">
                <button type="button" class="toggle-btn" onclick="toggleSub(this)">-</button>
                <button type="button" class="node main-branch" onclick="goPage(52, this)">المبحث 3: أدلة نبوة النبي ﷺ <span class="tag">52</span></button>
            </div>
            <ul>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(53, this)">1. النظام التشريعي <span class="tag">53</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(57, this)">2. الأخبار المستقبلية <span class="tag">57</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(64, this)">3. كمال حال النبي ﷺ <span class="tag">64</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(71, this)">4. أخبار الأمم الماضية <span class="tag">71</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(75, this)">5. الآيات وانخرام السنن <span class="tag">75</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(79, this)">6. القرآن العظيم <span class="tag">79</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(87, this)">7. الأخبار العلمية <span class="tag">87</span></button></div></li>
            </ul>
        </li>
        <li>
            <div class="node-row">
                <button type="button" class="toggle-btn" onclick="toggleSub(this)">-</button>
                <button type="button" class="node main-branch" onclick="goPage(93, this)">المبحث 4: حجية السنة <span class="tag">93</span></button>
            </div>
            <ul>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(94, this)">1. السنة وحي إلهي <span class="tag">94</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(100, this)">2. آثار إنكار السنة <span class="tag">100</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(104, this)">3. الوعد بحفظ السنة <span class="tag">104</span></button></div></li>
                <li><div class="node-row"><button type="button" class="node" onclick="goPage(107, this)">4. جهود العلماء <span class="tag">107</span></button></div></li>
            </ul>
        </li>
        <li><div class="node-row"><button type="button" class="node main-branch" onclick="goPage(112, this)">خاتمة <span class="tag">112</span></button></div></li>
        <li><div class="node-row"><button type="button" class="node main-branch" onclick="goPage(113, this)">المصادر والمراجع <span class="tag">113</span></button></div></li>
        <li><div class="node-row"><button type="button" class="node main-branch" onclick="goPage(118, this)">فهرس الآيات <span class="tag">118</span></button></div></li>
        <li><div class="node-row"><button type="button" class="node main-branch" onclick="goPage(129, this)">الفهرس العام <span class="tag">129</span></button></div></li>
    </ul>
</li></ul></div>
</div>

<div id="controls">
    <button type="button" onclick="goImg(cur - 1)">السابقة</button>
    <div>ص: <input type="number" id="jump-input" onchange="jump()"> <button type="button" onclick="jump()">اذهب</button></div>
    <span id="page-info">صفحة: 1</span>
    <button type="button" onclick="goImg(cur + 1)">التالية</button>
</div>

<div id="img-container">
    <img id="page-img" src="صور_مستخرجة/صفحة_1.jpg">
</div>

<!-- نافذة الملاحظات -->
<div id="notes-modal">
    <div id="notes-content">
        <div class="modal-header">
            <span>📝 دفتر الملاحظات الشخصي</span>
            <button type="button" class="close-btn" onclick="toggleNotes(false)">إغلاق ×</button>
        </div>
        <textarea id="notes-textarea" placeholder="اكتب ملاحظاتك هنا... يتم الحفظ تلقائياً." oninput="saveNotes()"></textarea>
    </div>
</div>

<script>
var cur = 1;
var offset = 1;
var currentZoom = 1;

// استرجاع الصفحة الأخيرة والملاحظات المحفوظة عند التحميل
window.onload = function() {
    var savedPage = localStorage.getItem('book_last_page');
    if (savedPage) {
        goImg(parseInt(savedPage));
    }
    var savedNotes = localStorage.getItem('book_user_notes');
    if (savedNotes) {
        document.getElementById('notes-textarea').value = savedNotes;
    }
}

function goImg(n, btn) {
    if (n < 1 || n > 133) return;
    cur = n;
    var displayPage = Math.max(1, n - offset);
    document.getElementById('page-info').innerText = 'صفحة: ' + displayPage;
    document.getElementById('jump-input').value = displayPage;
    document.getElementById('page-img').src = 'صفحة_' + n + '.jpg';

    document.getElementById('img-container').scrollTop = 0;
    
    // حفظ الصفحة الأخيرة تلقائياً
    localStorage.setItem('book_last_page', n);

    if (btn) {
        var all = document.querySelectorAll('.node');
        for (var i = 0; i < all.length; i++) { all[i].classList.remove('selected'); }
        btn.classList.add('selected');
    }
}

function goPage(p, btn) { goImg(p + offset, btn); }

function jump() {
    var v = parseInt(document.getElementById('jump-input').value);
    if (v) goPage(v);
}

function toggleTree() {
    var t = document.getElementById('tree-wrapper');
    var b = document.getElementById('btn-tree');
    t.classList.toggle('collapsed');
    b.innerText = t.classList.contains('collapsed') ? '🔽 إظهار الشجرة' : '🔼 إخفاء الشجرة';
}

function toggleNight() {
    document.getElementById('page-img').classList.toggle('night');
    document.getElementById('btn-night').classList.toggle('active');
}

// ميزة التكبير والتصغير
function zoomImg(amount) {
    currentZoom = Math.max(0.5, Math.min(3.0, currentZoom + amount));
    document.getElementById('page-img').style.transform = 'scale(' + currentZoom + ')';
}

function resetZoom() {
    currentZoom = 1;
    document.getElementById('page-img').style.transform = 'scale(1)';
}

// ميزة طي وفتح الأفرع الشجرية
function toggleSub(btn) {
    var subUl = btn.parentElement.nextElementSibling;
    if (subUl && subUl.tagName === 'UL') {
        if (subUl.style.display === 'none') {
            subUl.style.display = 'flex';
            btn.innerText = '-';
        } else {
            subUl.style.display = 'none';
            btn.innerText = '+';
        }
    }
}

// ميزة البحث الفوري داخل الشجرة
function searchTree(query) {
    var nodes = document.querySelectorAll('.node');
    query = query.trim().toLowerCase();
    nodes.forEach(function(node) {
        var text = node.innerText.toLowerCase();
        var row = node.closest('.node-row');
        if (query === '' || text.includes(query)) {
            row.style.display = 'flex';
        } else {
            row.style.display = 'none';
        }
    });
}

// التحكم بدفر الملاحظات
function toggleNotes(show) {
    document.getElementById('notes-modal').style.display = show ? 'flex' : 'none';
}

function saveNotes() {
    var text = document.getElementById('notes-textarea').value;
    localStorage.setItem('book_user_notes', text);
}
</script>
</body>
</html>
